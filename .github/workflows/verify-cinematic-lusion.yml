name: Verify cinematic portfolio

on:
  push:
    branches:
      - cinematic-lusion-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test production server
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/bobbio-russian.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000 > /tmp/home.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000 > /tmp/home.html
          grep -q "BOBBIO" /tmp/home.html
          grep -q "URBAN PONICS" /tmp/home.html
